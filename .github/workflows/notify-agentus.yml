name: Notify Agentes

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agentes workflow
        run: |
          gh workflow run --repo lklimek/agentes plugin-updated.yml
        env:
          GH_TOKEN: ${{ secrets.AGENTES_PAT }}
