name: Notify Agentus

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agentus workflow
        run: |
          gh workflow run --repo lklimek/agentus plugin-updated.yml
        env:
          GH_TOKEN: ${{ secrets.AGENTUS_PAT }}
